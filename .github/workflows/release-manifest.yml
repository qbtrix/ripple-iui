# .github/workflows/release-manifest.yml
# Publishes @ripple-ui/svelte to npm and attaches the manifest bundle to a
# GitHub release, on a v* tag push or a manual dispatch.
# Updated 2026-08-03: the "Resolve tag" step no longer pastes `${{ inputs.tag }}`
# into its shell script. Expressions are substituted before bash sees the
# script, so a dispatch input containing shell syntax would have run as code in
# the step. Both expressions now arrive as environment variables, which bash
# treats as data. Dispatching already requires write access, so this was never
# a privilege boundary — it just shouldn't be the shape of the code.
name: Release manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Creates the tag if it does not exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library + manifest
        run: bun run build

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Remove the token file on ANY exit (incl. a publish failure). Without
          # the trap, `set -e` aborts the step before `rm` runs and leaves the
          # NPM_TOKEN in $HOME/.npmrc on the runner. INT/TERM are trapped too:
          # bash skips the EXIT trap on an untrapped fatal signal, and a
          # cancelled workflow run signals the step mid-publish.
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          bun publish --access public

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release/ripple-manifest/schema
          cp dist/manifest.json release/manifest.json
          cp -r dist release/ripple-manifest/dist
          cp dist/manifest.json release/ripple-manifest/manifest.json
          cp src/lib/schema/*.ts release/ripple-manifest/schema/
          cd release
          zip -r ripple-manifest.zip ripple-manifest
          rm -rf ripple-manifest
          ls -la

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/manifest.json
            release/ripple-manifest.zip
