# .github/workflows/release-manifest.yml
# Publishes a GitHub release on a v* tag push or a manual dispatch: the widget
# manifests (manifest.json, manifest.slim.json), the manifest zip, and a packed
# tarball of @ripple-ui/core and @ripple-ui/svelte, so the release alone is
# installable. npm publishing runs only on a manual dispatch with
# publish_npm: true, and needs the NPM_TOKEN repo secret.
#
# Invariants:
# - Pack runs before publish, and the publish steps upload those exact
#   tarballs, so npm and the release carry the same bytes.
# - package.json in git stays workspace-shaped. The pack step rewrites it in
#   the runner only: core loses its `source` export conditions (they point at
#   src/, which is not shipped; the workspace build resolves core from source
#   with them), and svelte's `@ripple-ui/core: file:../core` becomes
#   `^<core version>`. Consumers of a ripple checkout rely on file:.
# - Core publishes before svelte, which depends on it. A version already on
#   npm is skipped, so a re-dispatch after a partial publish still reaches the
#   release step.
# - The token lives in $HOME/.npmrc only for the publish command; the trap
#   removes it on any exit, including a cancelled run.
# - Dispatch inputs reach shell scripts as environment variables, never as
#   pasted ${{ }} expressions, so shell syntax in an input stays data.
name: Release manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Creates the tag if it does not exist.'
        required: true
        type: string
      publish_npm:
        description: 'Also publish both packages to npm (needs NPM_TOKEN).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library + manifest
        run: bun run build

      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p release
          # Publish-shape package.json, in this runner only (see the header).
          node -e '
            const fs = require("fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
            const write = (f, p) => fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            const core = read("packages/core/package.json");
            const strip = (e) => {
              if (e && typeof e === "object") { delete e.source; Object.values(e).forEach(strip); }
            };
            strip(core.exports);
            if (JSON.stringify(core.exports).includes("\"source\"")) throw new Error("source condition left in core exports");
            write("packages/core/package.json", core);
            const svelte = read("packages/svelte/package.json");
            if (!svelte.dependencies || !svelte.dependencies["@ripple-ui/core"]) throw new Error("no @ripple-ui/core dependency");
            svelte.dependencies["@ripple-ui/core"] = "^" + core.version;
            write("packages/svelte/package.json", svelte);
          '
          grep -n '"@ripple-ui/core"' packages/svelte/package.json
          (cd packages/core && npm pack --pack-destination ../../release)
          (cd packages/svelte && npm pack --pack-destination ../../release)
          ls -la release

      - name: Publish @ripple-ui/core
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@ripple-ui/core@$V" version >/dev/null 2>&1; then
            echo "@ripple-ui/core@$V is already on npm, skipping"
            exit 0
          fi
          bun publish "./release/ripple-ui-core-$V.tgz" --access public

      - name: Publish @ripple-ui/svelte
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          V=$(node -p "require('./packages/svelte/package.json').version")
          if npm view "@ripple-ui/svelte@$V" version >/dev/null 2>&1; then
            echo "@ripple-ui/svelte@$V is already on npm, skipping"
            exit 0
          fi
          bun publish "./release/ripple-ui-svelte-$V.tgz" --access public

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release/ripple-manifest/schema
          cp packages/svelte/dist/manifest.json release/manifest.json
          cp packages/svelte/dist/manifest.slim.json release/manifest.slim.json
          cp -r packages/svelte/dist release/ripple-manifest/dist
          cp packages/svelte/dist/manifest.json release/ripple-manifest/manifest.json
          find packages/core/src/schema -maxdepth 1 -name '*.ts' ! -name '*.test.ts' -exec cp {} release/ripple-manifest/schema/ \;
          cd release
          zip -r ripple-manifest.zip ripple-manifest
          rm -rf ripple-manifest
          ls -la

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/manifest.json
            release/manifest.slim.json
            release/ripple-manifest.zip
            release/ripple-ui-core-*.tgz
            release/ripple-ui-svelte-*.tgz
