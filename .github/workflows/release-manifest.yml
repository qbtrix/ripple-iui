# .github/workflows/release-manifest.yml
# Publishes a GitHub release on a v* tag push or a manual dispatch: the
# manifest bundle plus a packed tarball of each package. Publishing
# @ripple-ui/core and @ripple-ui/svelte to npm is opt-in.
# Updated 2026-09-27 (v0.8.0): npm publishing runs only on a manual dispatch
# with publish_npm: true. A tag push used to try npm every time, and every
# such run failed without an NPM_TOKEN; with a token present anywhere (repo
# or org), a tag would publish to npm whether or not that was intended. The
# release now also carries ripple-ui-core-<v>.tgz and ripple-ui-svelte-<v>.tgz
# (svelte's core dependency rewritten to ^<core version>, as for npm), so the
# GitHub release alone is installable.
# Updated 2026-09-27: the release also attaches manifest.slim.json, the slim
# manifest (spec envelope + the slim runtime's actions, no widgets), next to
# the full manifest.json.
# Updated 2026-09-27: fixed for the bun workspace layout (packages/core,
# packages/svelte). `bun publish` ran at the repo root, whose package.json is
# the private workspace root, so v0.7.0 failed with "attempted to publish a
# private package". Each package now publishes from its own directory, core
# first because svelte depends on it. svelte's `@ripple-ui/core: file:../core`
# is rewritten to `^<core version>` inside the runner just before publish
# (bun only rewrites `workspace:` ranges); package.json in git keeps file:, which
# is what the workspace repos that consume ripple from a checkout rely on. A
# version already on npm is skipped, so a re-dispatch after a partial publish
# goes on to the release step. Asset paths moved to packages/svelte/dist, and the
# schema sources in the zip now come from packages/core/src/schema (svelte's
# schema/ is a re-export barrel). Earlier tag runs also failed with "missing
# authentication": the NPM_TOKEN repo secret has to be set for any of this to
# publish.
# Updated 2026-08-03: the "Resolve tag" step no longer pastes `${{ inputs.tag }}`
# into its shell script. Expressions are substituted before bash sees the
# script, so a dispatch input containing shell syntax would have run as code in
# the step. Both expressions now arrive as environment variables, which bash
# treats as data. Dispatching already requires write access, so this was never
# a privilege boundary — it just shouldn't be the shape of the code.
name: Release manifest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.1). Creates the tag if it does not exist.'
        required: true
        type: string
      publish_npm:
        description: 'Also publish both packages to npm (needs NPM_TOKEN).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library + manifest
        run: bun run build

      - name: Publish @ripple-ui/core
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        working-directory: packages/core
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Remove the token file on ANY exit (incl. a publish failure). Without
          # the trap, `set -e` aborts the step before `rm` runs and leaves the
          # NPM_TOKEN in $HOME/.npmrc on the runner. INT/TERM are trapped too:
          # bash skips the EXIT trap on an untrapped fatal signal, and a
          # cancelled workflow run signals the step mid-publish.
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          V=$(node -p "require('./package.json').version")
          if npm view "@ripple-ui/core@$V" version >/dev/null 2>&1; then
            echo "@ripple-ui/core@$V is already on npm, skipping"
            exit 0
          fi
          bun publish --access public

      - name: Publish @ripple-ui/svelte
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        working-directory: packages/svelte
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$HOME/.npmrc"' EXIT INT TERM
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          V=$(node -p "require('./package.json').version")
          if npm view "@ripple-ui/svelte@$V" version >/dev/null 2>&1; then
            echo "@ripple-ui/svelte@$V is already on npm, skipping"
            exit 0
          fi
          # file:../core means nothing to an npm consumer. Point it at the
          # published core version, in this runner only.
          CORE_V=$(node -p "require('../core/package.json').version")
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!p.dependencies || !p.dependencies["@ripple-ui/core"]) throw new Error("no @ripple-ui/core dependency");
            p.dependencies["@ripple-ui/core"] = "^" + process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$CORE_V"
          grep -n '"@ripple-ui/core"' package.json
          bun publish --access public

      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p release
          (cd packages/core && npm pack --pack-destination ../../release)
          # Same rewrite as the npm publish step (idempotent if it already ran):
          # file:../core means nothing outside this repo.
          CORE_V=$(node -p "require('./packages/core/package.json').version")
          (cd packages/svelte && node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.dependencies["@ripple-ui/core"] = "^" + process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          ' "$CORE_V" && npm pack --pack-destination ../../release)
          ls -la release

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release/ripple-manifest/schema
          cp packages/svelte/dist/manifest.json release/manifest.json
          cp packages/svelte/dist/manifest.slim.json release/manifest.slim.json
          cp -r packages/svelte/dist release/ripple-manifest/dist
          cp packages/svelte/dist/manifest.json release/ripple-manifest/manifest.json
          find packages/core/src/schema -maxdepth 1 -name '*.ts' ! -name '*.test.ts' -exec cp {} release/ripple-manifest/schema/ \;
          cd release
          zip -r ripple-manifest.zip ripple-manifest
          rm -rf ripple-manifest
          ls -la

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/manifest.json
            release/manifest.slim.json
            release/ripple-manifest.zip
            release/ripple-ui-core-*.tgz
            release/ripple-ui-svelte-*.tgz
