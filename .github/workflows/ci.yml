# .github/workflows/ci.yml
# Created 2026-07-08 (RCR-1): PR gate for @ripple-ui/svelte. Runs the full
# vitest suite and svelte-check on every pull request and on pushes to main.
# Before this workflow the repo had no CI test gate, so a failing unit test and
# 33 svelte-check errors sat on main undetected. Keep it minimal: install, test,
# type-check. The separate release-manifest.yml handles tag publishes.
# Updated 2026-09-19: lint is a CI step here rather than the first half of
# @ripple-ui/svelte's build script. It ran inside the build, so every style
# rule in the repo gated the deploy image that builds ripple from source --
# a finding in a Playwright spec that svelte-package never ships was enough
# to fail the whole docker layer. Same coverage, failing the PR instead of a
# consumer's build. The workerd-SSR anim-import guard (lint:anim) is NOT
# style and stays inside build, where it gates the artifact it protects.
# Updated (review): pin the bun toolchain (deps are already lockfile-frozen),
# cancel superseded runs per ref, and cap the job so a hung test process
# can't hold a runner for GitHub's 6-hour default.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build before check: @ripple-ui/core publishes its types from dist/, which
      # only exists after `tsc -p tsconfig.build.json` runs, so svelte-check in
      # packages/svelte cannot resolve the module on a fresh checkout. Also the
      # first time CI has exercised the build at all.
      - name: Build
        run: bun run build

      - name: Lint
        # oxlint, incl. the type-aware pass. Runs after Build so tsgolint can
        # resolve @ripple-ui/core's published types and the generated
        # .svelte-kit/tsconfig.json, exactly as it did when it lived in build.
        run: bun run lint

      - name: Unit tests
        # `bun run test` at the root fans out with --filter '*' so each package
        # uses its OWN vitest config. Bare `bunx vitest run` has no root config
        # after the monorepo split: no $lib alias and no @ripple-ui/core
        # resolution, so whole test files fail to import rather than fail an
        # assertion (26/26, 29/29 ... in run 34844664804).
        run: bun run test

      - name: Type check
        run: bun run check
